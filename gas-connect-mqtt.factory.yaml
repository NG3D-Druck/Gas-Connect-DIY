packages:
  # Include all of the core configuration of the MQTT variant
  core: !include gas-connect-mqtt.yaml

esphome:
  # This will allow for project identification,
  # configuration and updates.
  project:
    name: ng3d.gas-connect-diy-mqtt
    version: dev  # This will be replaced by the github workflows with the `release` version

# Sets up Bluetooth LE to allow the user
# to provision wifi credentials to the device.
improv_ble:
  authorizer: none

# Sets up the improv via serial client for Wi-Fi provisioning
# over the USB-C port of the ESP32-C3-Zero.
improv_serial:

# Used to pull OTA updates
http_request:

ota:
  - platform: http_request

# Offers new firmware on the device's web page and via MQTT
update:
  - platform: http_request
    id: update_http_request
    name: Firmware
    source: https://ng3d-druck.github.io/Gas-Connect-DIY/firmware/gas-connect-diy-mqtt.manifest.json
