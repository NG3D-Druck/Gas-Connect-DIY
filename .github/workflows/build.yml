name: Build

on:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release Drafter"]
    types: [completed]

# The called workflow's draft-release jobs (read draft info, upload assets,
# strip the pending warning) need contents: write; they only run on
# workflow_run events. Fork pull requests still get a read-only token.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && 'release-drafter' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build to Draft Release
    # Builds the factory configs and — when triggered by a successful Release
    # Drafter run — uploads the firmware to the current draft release. On
    # pull_request / workflow_dispatch it only builds.
    uses: esphome/workflows/.github/workflows/build-to-draft-release.yml@e1432c7b31fec7d24a13dc192953ebac836ed98a  # 2026.10.3
    with:
      #### Modify below here to match your project ####
      # One manifest per variant. The name of the Home Assistant variant must
      # stay gas-connect-diy: installed devices look for updates under it.
      groups: >-
        [
          {"name": "gas-connect-diy", "files": ["gas-connect.factory.yaml"]},
          {"name": "gas-connect-diy-mqtt", "files": ["gas-connect-mqtt.factory.yaml"]}
        ]
      esphome-version: 2026.10.0
      #### Modify above here to match your project ####
